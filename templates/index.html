<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול הפקות לקוחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">ה.פ</span>
        <span class="brand-name">ניהול הפקות</span>
      </div>
      <a class="logout-link" href="{{ url_for('logout') }}">התנתקות</a>
    </div>
  </header>

  <main class="wrap">

    <section class="panel search-panel">
      <div class="segment-group" id="search-by-group">
        <button type="button" class="segment active" data-value="tz">ת.ז</button>
        <button type="button" class="segment" data-value="name">שם לקוח</button>
        <button type="button" class="segment" data-value="company">חברה</button>
        <button type="button" class="segment" data-value="product">מוצר</button>
      </div>

      <label class="field-label" for="tz-input" id="search-label" style="margin-top: 14px;">תעודת זהות לקוח</label>
      <input id="tz-input" class="tz-input" type="text" inputmode="numeric" placeholder="לדוגמה: 123456789" maxlength="9">
      <select id="company-search-select" class="tz-input" style="margin-top: 0;" hidden></select>
      <select id="product-search-select" class="tz-input" style="margin-top: 0;" hidden></select>

      <div class="segment-group" id="sheet-type-group">
        <button type="button" class="segment active" data-value="pension">פנסיוני</button>
        <button type="button" class="segment" data-value="detail">פרט</button>
      </div>

      <div class="action-group">
        <button type="button" class="action-btn primary" id="btn-update">
          <span class="action-title">עדכון שינויים</span>
          <span class="action-sub">שורות שטרם דווחו</span>
        </button>
        <button type="button" class="action-btn" id="btn-view">
          <span class="action-title">הצגת כל השורות</span>
          <span class="action-sub">תצוגה מלאה, כולל דווחו</span>
        </button>
      </div>

      <button type="button" class="action-btn" id="btn-create-row" style="margin-top: 10px; width: 100%;">
        <span class="action-title">הקמת שורה חדשה</span>
        <span class="action-sub">פתיחת לקוח/הפקה חדשה בטאב הנבחר</span>
      </button>

      <button type="button" class="action-btn" id="btn-reports" style="margin-top: 10px; width: 100%;">
        <span class="action-title">דוחות</span>
        <span class="action-sub">ניוד בפועל וצפי ניוד לפי חודש ומוצר (פנסיוני)</span>
      </button>
    </section>

    <section class="panel" id="reports-panel" hidden>
      <div class="segment-group" id="reports-segment-group">
        <button type="button" class="segment active" data-value="actual">ניוד בפועל</button>
        <button type="button" class="segment" data-value="potential">צפי ניוד (פוטנציאל)</button>
      </div>

      <label class="field-label" style="margin-top: 14px;">מוצר</label>
      <select id="report-product-select" class="tz-input"></select>

      <label class="field-label" style="margin-top: 14px;">חודש</label>
      <select id="report-month-select" class="tz-input"></select>

      <div id="report-result" style="margin-top: 18px; text-align: center; padding: 20px; background: var(--paper); border-radius: 10px; border: 1.5px solid var(--line);">
        <div id="report-result-number" style="font-size: 32px; font-weight: 800; color: var(--ink);">—</div>
        <div id="report-result-label" style="font-size: 13px; color: var(--ink-soft); margin-top: 4px;">בחר מוצר וחודש</div>
      </div>
    </section>

    <section class="panel results-panel" id="results-panel" hidden>
      <div class="results-header">
        <h2 id="results-title"></h2>
        <span class="results-count" id="results-count"></span>
      </div>
      <select id="results-sort-select" class="tz-input" style="margin-bottom: 12px; font-size: 13px; padding: 8px 10px;">
        <option value="none">ללא מיון</option>
        <option value="desc">תאריך עדכון: מהכי חדש</option>
        <option value="asc">תאריך עדכון: מהכי ישן</option>
      </select>
      <div id="results-list" class="results-list"></div>
    </section>

    <div class="empty-state" id="empty-state" hidden>
      <p id="empty-text">הזן תעודת זהות ובחר פעולה</p>
    </div>

    <div class="loading" id="loading" hidden>
      <div class="spinner"></div>
      <span>טוען נתונים מהגיליון…</span>
    </div>

  </main>

  <div class="modal-backdrop" id="edit-backdrop" hidden>
    <div class="modal" id="edit-modal">
      <div class="modal-header">
        <h3>עריכת שורה</h3>
        <button type="button" class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="action-btn primary" id="save-row">שמירת שינויים</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
