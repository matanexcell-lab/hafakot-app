<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>סיכום שיחה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .app-wrapper {
      width: 100%;
      max-width: 520px;
      padding: 24px 12px 40px;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12);
      padding: 22px 18px 16px;
    }
    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .step-indicator {
      text-align: center;
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 8px;
    }
    .question-title {
      font-size: 17px;
      font-weight: 650;
      margin: 8px 0;
    }
    .field-label {
      font-size: 14px;
      margin: 8px 0 6px;
      color: #374151;
      font-weight: 600;
    }
    select,
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
      background-color: #fff;
    }
    select:focus,
    input:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.6);
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .buttons-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 11px 0;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-small {
      flex: 0 0 auto;
      padding-inline: 14px;
      font-size: 13px;
      margin-top: 8px;
    }
    .btn-primary:active,
    .btn-secondary:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .helper-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.35;
    }
    .summary-box {
      margin-top: 16px;
      background: #111827;
      color: #f9fafb;
      border-radius: 16px;
      padding: 16px 14px;
      white-space: pre-wrap;
      font-size: 14px;
      direction: rtl;
      line-height: 1.45;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .mode-pill {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      white-space: nowrap;
    }
    .hidden {
      display: none !important;
    }
    ul { margin: 8px 0 0; padding: 0 18px 0 0; }
    li { margin: 6px 0; }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="card">
      <div class="top-row">
        <h1>סיכום שיחה</h1>
        <span id="modePill" class="mode-pill"></span>
      </div>

      <div id="subtitle" class="subtitle"></div>
      <div id="stepIndicator" class="step-indicator"></div>

      <div id="formContainer"></div>

<div id="pdfBox" style="margin-top:16px;">
  <label class="field-label">העלה PDF של המסלקה:</label>

  <input
    type="file"
    id="pdfUpload"
    accept=".pdf"
    style="
      width:100%;
      padding:10px;
      border:1px solid #d1d5db;
      border-radius:10px;
      background:white;
    "
  />
</div>

      <div class="buttons-row">
        <button id="backBtn" class="btn btn-secondary">חזרה</button>
        <button id="nextBtn" class="btn btn-primary">המשך</button>
      </div>

      <button id="copyBtn" class="btn btn-secondary btn-small hidden" style="width:100%;">
        העתק סיכום
      </button>

      <div id="summaryBox" class="summary-box hidden"></div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>

  const ACTION_TYPES = ["ניוד", "השארה", "פתיחת קופה", "פרט"];
  const INVEST_COMPANIES = ["מגדל","כלל","הראל","אלטשולר שחם","ילין לפידות","אנליסט","מיטב","מור","הפניקס","הכשרה","מנורה","איילון","ביטוח ישיר"];
  const INSURANCE_COMPANIES = ["מגדל","כלל","הראל","הפניקס","הכשרה","מנורה","איילון","ביטוח ישיר","ליברה"];
  const PRODUCTS = ["קרן פנסיה","קרן השתלמות","קופת גמל","קופת גמל להשקעה"];
  const PRIVATE_PRODUCTS = ["פוליסת חיים","פוליסת חיים משועבדת","פוליסת חיים למשכנתא","פוליסת משכנתא","ביטוח בריאות","ביטוח בריאות ומחלות קשות","ביטוח מחלות קשות"];
  const PRIVATE_ACTIONS = ["ביטול","השארה","הפקה","מינוי סוכן","ביטול והפקה חדשה"];
  const BASE_TRACKS = ["כללי","לבני 50 ומטה","לבני 50-60","לבני 60 ומעלה","מניות","Snp500","משולב סחיר","עוקב מדדים גמיש","מניות סחיר","עוקב מדדי מניות","השלוש הקדוש","חצי חצי אנליסט","חצי חצי הראל פנסיה"];
  const SPECIAL_TRACK_OUTPUT = {
    "השלוש הקדוש": "33% משולב סחיר, 33% מדדי מניות, 34% Snp500",
    "חצי חצי אנליסט": "50% עוקב מדדים גמיש, 50% Snp500",
    "חצי חצי הראל פנסיה": "50% מניות סחיר, 50% Snp500"
  };
  const EMPLOYMENT_TYPES = ["שכירה","עצמאית","ללא"];
  const MODE_SUMMARY = "סיכום הדברים";
  const MODE_RECOMMENDATION = "המלצות";
  const HEBREW_LETTERS = "אבגדהוזחטיכלמנסעפצקרשת".split("");

  let mode = MODE_SUMMARY;
  let totalActions = 1;
  let currentActionIndex = 0;
  let currentStep = "mode";
  let history = [];
  const actions = [];
  let moreActionsAnswer = "";
  let moreActionsCount = 0;

  function getCurrentAction() {
    if (!actions[currentActionIndex]) {
      actions[currentActionIndex] = { index: currentActionIndex, type: null, reasons: [] };
    }
    return actions[currentActionIndex];
  }

  function setSubtitle(text) { document.getElementById("subtitle").textContent = text || ""; }

  function setStepIndicator() {
    const el = document.getElementById("stepIndicator");
    if (currentStep === "mode" || currentStep === "totalActions" || currentStep === "moreActions") { el.textContent = ""; return; }
    el.textContent = `פעולה ${currentActionIndex + 1} מתוך ${totalActions}`;
  }

  function setModePill() {
    const pill = document.getElementById("modePill");
    pill.textContent = mode === MODE_SUMMARY ? "מצב: סיכום דברים" : "מצב: המלצות";
  }

  function createSelect(id, options, value) {
    const htmlOptions = options.map(opt => `<option value="${opt}" ${opt === value ? "selected" : ""}>${opt}</option>`).join("");
    return `<select id="${id}"><option value="">בחר...</option>${htmlOptions}<option value="אחר" ${value === "אחר" ? "selected" : ""}>אחר...</option></select>`;
  }

  function getValue(id) { const el = document.getElementById(id); return el ? (el.value || "").trim() : ""; }
  function resolveProduct(a) { return (a.product === "אחר" ? (a.productOther || "") : (a.product || "")).trim(); }
  function formatTrack(track) { if (SPECIAL_TRACK_OUTPUT[track]) return SPECIAL_TRACK_OUTPUT[track]; return track; }
  function formatCompanyWithOther(selected, other) { if (selected === "אחר") return (other || "").trim(); return (selected || "").trim(); }

  function shouldAskDeposit(a) {
    const p = resolveProduct(a);
    if (p === "קופת גמל להשקעה") return true;
    if (a.employmentType === "עצמאית" && ["קרן פנסיה","קרן השתלמות","קופת גמל"].includes(p)) return true;
    return false;
  }

  function shouldShowEmployment(a) {
    const p = resolveProduct(a);
    return ["קרן פנסיה","קרן השתלמות","קופת גמל"].includes(p);
  }

  function render() {
    const container = document.getElementById("formContainer");
    const summaryBox = document.getElementById("summaryBox");
    const copyBtn = document.getElementById("copyBtn");
    summaryBox.classList.add("hidden");
    summaryBox.textContent = "";
    copyBtn.classList.add("hidden");
    setModePill();
    setStepIndicator();
    const a = getCurrentAction();
    let html = "";
    if (currentStep === "fundPreview") {
      html += renderFundPreview(a);
      if (a.type) { html += renderNextFieldsForAction(a); }
      container.innerHTML = html;
      wireDynamicVisibility();
      return;
    }

    switch (currentStep) {
      case "mode":
        setSubtitle("");
        html += `<div class="question-title">האם זה סיכום של הדברים או המלצות?</div>`;
        html += createSelect("modeSelect", [MODE_SUMMARY, MODE_RECOMMENDATION], mode);
        html += `<div class="helper-text">במצב "המלצות" ניתן להוסיף נימוקים אחרי כל פעולה.</div>`;
        break;
      case "totalActions":
        setSubtitle("");
        html += `<div class="question-title">כמה פעולות אתה רוצה לרשום?</div>`;
        html += `<input type="number" id="actionsCount" min="1" max="20" value="${totalActions}" />`;
        html += `<div class="helper-text">אפשר לשנות אחר כך אם צריך.</div>`;
        break;
      case "actionType":
        setSubtitle("סוג פעולה");
        html += `<div class="field-label">מה סוג הפעולה?</div>`;
        html += createSelect("actionTypeSelect", ACTION_TYPES, a.type);
        if (a.type) { html += renderNextFieldsForAction(a); }
        break;
      case "reasons":
        setSubtitle("נימוקים להמלצה");
        html += `<div class="field-label">כתוב נימוק להמלצה זו:</div>`;
        html += `<textarea id="reasonInput" placeholder="לדוגמה: דמי ניהול נמוכים יותר, תשואות טובות יותר וכו'"></textarea>`;
        if (a.reasons && a.reasons.length) {
          html += `<div class="field-label" style="margin-top:10px;">נימוקים שנוספו:</div><ul>`;
          a.reasons.forEach((r, idx) => {
            const letter = a.reasons.length > 1 ? `${HEBREW_LETTERS[idx]}. ` : "";
            html += `<li>${letter}${r}</li>`;
          });
          html += `</ul>`;
        }
        html += `<button type="button" class="btn btn-secondary btn-small" id="addReasonBtn">הוסף נימוק נוסף</button>`;
        break;
      case "moreActions":
        setSubtitle("");
        html += `<div class="question-title">האם יש פעולות נוספות שברצונך להוסיף?</div>`;
        html += createSelect("moreActionsSelect", ["לא", "כן"], moreActionsAnswer);
        if (moreActionsAnswer === "כן") {
          html += `<div class="field-label" style="margin-top:12px;">כמה פעולות נוספות יש לרשום?</div>`;
          html += `<input type="number" id="moreActionsCount" min="1" max="20" value="${moreActionsCount || 1}" />`;
        }
        break;
    }

    container.innerHTML = html;
    const addBtn = document.getElementById("addReasonBtn");
    if (addBtn) {
      addBtn.onclick = () => {
        const txt = getValue("reasonInput");
        if (!txt) return;
        a.reasons = a.reasons || [];
        a.reasons.push(txt);
        document.getElementById("reasonInput").value = "";
        render();
      };
    }
    wireDynamicVisibility();
    document.getElementById("backBtn").disabled = (history.length === 0 && currentStep === "mode");
  }

  function renderFundPreview(a) {
    const actionTypesForPdf = ACTION_TYPES.filter(t => t !== "פתיחת קופה");

    if (a.type === "פרט" || a.privateCompany) {
      const previewCompany = formatCompanyWithOther(a.privateCompany, a.privateCompanyOther);
      const previewProduct = (a.privateProduct === "אחר" ? a.privateProductOther : a.privateProduct);
      return `
        <div class="question-title">פרטי הפוליסה שנקראו מהמסלקה</div>
        <div class="summary-box" style="background:#f3f4f6;color:black;margin-top:10px;">
          חברה: ${previewCompany || "-"}<br>
          מוצר: ${previewProduct || "-"}<br>
          מספר פוליסה: ${a.policyNumber || "-"}<br>
          מחיר: ${a.newPolicyPremium ? a.newPolicyPremium + " ₪" : "-"}
        </div>
        <div class="field-label" style="margin-top:15px;">מה לעשות עם הפוליסה?</div>
        ${createSelect("actionTypeSelect", actionTypesForPdf, a.type)}
      `;
    }

    return `
      <div class="question-title">פרטי הקופה שנקראו מהמסלקה</div>
      <div class="summary-box" style="background:#f3f4f6;color:black;margin-top:10px;">
        חברה: ${a.company || "-"}<br>
        מוצר: ${a.product || "-"}<br>
        מספר קופה: ${a.accountNumber || "-"}<br>
        מסלול: ${a.currentTrack || "-"}<br>
        דמי ניהול: ${a.managementFee || "-"}
      </div>
      <div class="field-label" style="margin-top:15px;">מה לעשות עם הקופה?</div>
      ${createSelect("actionTypeSelect", actionTypesForPdf.filter(t => t !== "פרט"), a.type)}
    `;
  }

  function renderNextFieldsForAction(a) {
    let html = "";

    if (a.type === "פרט") {
      const isBrandNew = a.privateAction === "הפקה";

      if (!isBrandNew) {
        html += `
          <div class="field-label">מה שם חברת הביטוח?</div>
          ${createSelect("privateCompanySelect", INSURANCE_COMPANIES, a.privateCompany)}
          <input type="text" id="privateCompanyOther" class="${a.privateCompany === "אחר" ? "" : "hidden"}" placeholder="שם חברה (אם 'אחר')" style="margin-top:6px;" value="${a.privateCompanyOther || ""}" />
        `;
      }

      html += `
        <div class="field-label" style="margin-top:12px;">מה סוג הביטוח?</div>
        ${createSelect("privateProductSelect", PRIVATE_PRODUCTS, a.privateProduct)}
        <input type="text" id="privateProductOther" class="${a.privateProduct === "אחר" ? "" : "hidden"}" placeholder="סוג ביטוח (אם 'אחר')" style="margin-top:6px;" value="${a.privateProductOther || ""}" />
        <div class="field-label" style="margin-top:12px;">מה סוג הפעולה בפוליסה?</div>
        ${createSelect("privateActionSelect", a.fromPdf ? PRIVATE_ACTIONS.filter(x => x !== "הפקה") : PRIVATE_ACTIONS, a.privateAction)}
      `;

      if (a.privateAction && a.privateAction !== "הפקה") {
        html += `
          <div class="field-label" style="margin-top:12px;">מספר פוליסה</div>
          <input type="text" id="policyNumberInput" value="${a.policyNumber || ""}" />
        `;
      }

      const isNewIssue = a.privateAction === "הפקה" || a.privateAction === "ביטול והפקה חדשה";

      if (isNewIssue) {
        if (a.privateAction === "ביטול והפקה חדשה") {
          html += `
            <div class="field-label" style="margin-top:12px;">סוג הביטוח החדש</div>
            ${createSelect("newPolicyTypeSelect", PRIVATE_PRODUCTS, a.newPolicyType)}
            <input type="text" id="newPolicyTypeOther" class="${a.newPolicyType === "אחר" ? "" : "hidden"}" placeholder="סוג ביטוח (אם 'אחר')" style="margin-top:6px;" value="${a.newPolicyTypeOther || ""}" />
          `;
        }

        html += `
          <div class="field-label" style="margin-top:12px;">באיזו חברה תופק הפוליסה?</div>
          ${createSelect("newPolicyCompanySelect", INSURANCE_COMPANIES, a.newPolicyCompany)}
          <input type="text" id="newPolicyCompanyOther" class="${a.newPolicyCompany === "אחר" ? "" : "hidden"}" placeholder="שם חברה (אם 'אחר')" style="margin-top:6px;" value="${a.newPolicyCompanyOther || ""}" />
        `;

        const relevantProduct = a.privateAction === "ביטול והפקה חדשה"
          ? (a.newPolicyType === "אחר" ? a.newPolicyTypeOther : a.newPolicyType)
          : a.privateProduct;

        const needSum = [
          "פוליסת חיים", "פוליסת חיים משועבדת", "פוליסת חיים למשכנתא", "פוליסת משכנתא",
          "ביטוח מחלות קשות", "ביטוח בריאות ומחלות קשות"
        ].includes(relevantProduct);

        if (needSum) {
          html += `
            <div class="field-label" style="margin-top:12px;">מהו סכום הביטוח (פיצוי)?</div>
            <input type="number" id="insuranceSumInput" value="${a.insuranceSum || ""}" />
          `;
        }

        html += `
          <div class="field-label" style="margin-top:12px;">מה הפרמיה החודשית?</div>
          <input type="number" id="newPolicyPremium" value="${a.newPolicyPremium || ""}" />
        `;
      }

      return html;
    }

    if (!a.fromPdf) {
      if (a.type === "ניוד") {
        html += `
          <div class="field-label">מה שם החברה הקיימת?</div>
          ${createSelect("companySelect", INVEST_COMPANIES, a.company)}
          <input type="text" id="companyOther" class="${a.company === "אחר" ? "" : "hidden"}" placeholder="שם החברה (אם 'אחר')" style="margin-top:6px;" value="${a.companyOther || ""}" />
          <div class="field-label" style="margin-top:12px;">מה סוג המוצר בקופה הקיימת?</div>
          ${createSelect("productSelect", PRODUCTS, a.product)}
          <input type="text" id="productOther" class="${a.product === "אחר" ? "" : "hidden"}" placeholder="סוג מוצר (אם 'אחר')" style="margin-top:6px;" value="${a.productOther || ""}" />
        `;
      } else if (a.type === "השארה") {
        html += `
          <div class="field-label">מה שם החברה?</div>
          ${createSelect("companySelect", INVEST_COMPANIES, a.company)}
          <input type="text" id="companyOther" class="${a.company === "אחר" ? "" : "hidden"}" placeholder="שם החברה (אם 'אחר')" style="margin-top:6px;" value="${a.companyOther || ""}" />
          <div class="field-label" style="margin-top:12px;">מה סוג המוצר?</div>
          ${createSelect("productSelect", PRODUCTS, a.product)}
          <input type="text" id="productOther" class="${a.product === "אחר" ? "" : "hidden"}" placeholder="סוג מוצר (אם 'אחר')" style="margin-top:6px;" value="${a.productOther || ""}" />
        `;
      } else if (a.type === "פתיחת קופה") {
        html += `
          <div class="field-label">מה סוג המוצר?</div>
          ${createSelect("productSelect", PRODUCTS, a.product)}
          <input type="text" id="productOther" class="${a.product === "אחר" ? "" : "hidden"}" placeholder="סוג מוצר (אם 'אחר')" style="margin-top:6px;" value="${a.productOther || ""}" />
          <div class="field-label" style="margin-top:12px;">מה שם החברה?</div>
          ${createSelect("companySelect", INVEST_COMPANIES, a.company)}
          <input type="text" id="companyOther" class="${a.company === "אחר" ? "" : "hidden"}" placeholder="שם החברה (אם 'אחר')" style="margin-top:6px;" value="${a.companyOther || ""}" />
        `;
      }
    }

    if (!a.fromPdf && ["קרן פנסיה","קרן השתלמות","קופת גמל"].includes(a.product)) {
      html += `
        <div class="field-label">האם הלקוח שכיר, עצמאי או ללא?</div>
        ${createSelect("employmentSelect", EMPLOYMENT_TYPES, a.employmentType)}
      `;
      if (a.employmentType === "שכירה") {
        html += `<input type="text" id="employerName" placeholder="שם המעסיק" value="${a.employerName || ""}" style="margin-top:6px;" />`;
      }
    }

    if (
      a.product === "קופת גמל להשקעה" ||
      (a.employmentType === "עצמאית" && ["קרן פנסיה","קרן השתלמות","קופת גמל"].includes(a.product))
    ) {
      html += `
        <div class="field-label">אופי הפקדה</div>
        ${createSelect("depositType", ["ללא הפקדה","הוראת קבע","חד פעמי","גם וגם"], a.depositType)}
        <input type="text" id="depositTypeOther" class="${a.depositType === "אחר" ? "" : "hidden"}" placeholder="אופי הפקדה אחר (אם 'אחר')" style="margin-top:6px;" value="${a.depositTypeOther || ""}" />
      `;
      if (a.depositType === "הוראת קבע" || a.depositType === "גם וגם") {

  function computeNextStep() {
    const a = getCurrentAction();
    if (currentStep === "mode") return "totalActions";

    if (currentStep === "totalActions") {
      currentActionIndex = 0;
      const firstFund = actions[0];
      if (firstFund && (firstFund.company || firstFund.product || firstFund.accountNumber)) { return "fundPreview"; }
      return "actionType";
    }

    if (currentStep === "fundPreview") {
      if (mode === MODE_RECOMMENDATION) { return "reasons"; }
      return advanceActionOrFinish();
    }

    if (currentStep === "actionType") {
      return mode === MODE_RECOMMENDATION ? "reasons" : advanceActionOrFinish();
    }

    if (currentStep === "reasons") { return advanceActionOrFinish(); }

    if (currentStep === "moreActions") {
      if (moreActionsAnswer === "כן") {
        const startIndex = totalActions;
        totalActions = totalActions + moreActionsCount;
        actions.length = totalActions;
        currentActionIndex = startIndex;
        moreActionsAnswer = "";
        moreActionsCount = 0;
        return "actionType";
      }
      return null;
    }

    return null;
  }

  function advanceActionOrFinish() {
    if (currentActionIndex + 1 < totalActions) {
      currentActionIndex++;
      const nextAction = actions[currentActionIndex];
      if (nextAction && (nextAction.company || nextAction.product || nextAction.accountNumber)) { return "fundPreview"; }
      return "actionType";
    }
    return "moreActions";
  }

  document.getElementById("pdfUpload").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function () {
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ");
      }
      parsePdfData(text);
    };
    reader.readAsArrayBuffer(file);
  });

  function parsePdfData(text) {
    actions.length = 0;

    const PRODUCT_TYPES = ["קרנות השתלמות", "קרן השתלמות", "קרן פנסיה", "קופת גמל להשקעה", "קופת גמל", "פוליסות פנסיוניות", "פוליסת פנסיה", "פרט"];
    const splitRegex = new RegExp("(?=\\d+\\s{2,}(?:" + PRODUCT_TYPES.join("|") + ")\\s*-\\s*)");
    const sections = text.split(splitRegex).filter(s => /מספר תוכנית:/.test(s));

    const productMap = {
      "קרנות השתלמות": "קרן השתלמות", "קרן השתלמות": "קרן השתלמות", "קרן פנסיה": "קרן פנסיה",
      "קופת גמל להשקעה": "קופת גמל להשקעה", "קופת גמל": "קופת גמל",
      "פוליסות פנסיוניות": "פוליסת פנסיה", "פוליסת פנסיה": "פוליסת פנסיה"
    };

    sections.forEach((section) => {
      const headerMatch = section.match(/^\d+\s+(.+?)\s*-\s*(.+?)\s{2,}/);
      let rawProductType = "";
      let rawCompany = "";
      if (headerMatch) { rawProductType = headerMatch[1].trim(); rawCompany = headerMatch[2].trim(); }

      const allCompaniesForMatch = [...new Set([...INVEST_COMPANIES, ...INSURANCE_COMPANIES])];

      if (rawProductType === "פרט") {
        let privateCompany = "לא זוהה";
        const foundCompanyP = allCompaniesForMatch.find(c => {
          const re = new RegExp("(^|\\s)" + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "(\\s|$)");
          return re.test(rawCompany);
        });
        privateCompany = foundCompanyP || rawCompany || "לא זוהה";

        let policyNumber = "";
        let mNum = section.match(/(\d[\d\-]{4,})\s+מספר תוכנית:/) || section.match(/מספר תוכנית:\s*(\d[\d\-]{4,})/);
        if (mNum) policyNumber = mNum[1];

        let premium = "";
        let mPrem = section.match(/₪([\d,.]+)\s+הפקדה:/) || section.match(/הפקדה:\s*₪?([\d,.]+)/);
        if (mPrem) premium = mPrem[1].replace(/,/g, '');

        let insuranceSum = "";
        let mSum = section.match(/ש''ח\s+[\d.]+\s+ש''ח עלות\s+([\d,]+)/);
        if (mSum) insuranceSum = mSum[1].replace(/,/g, '');

        let planNameMatch = section.match(/שם תוכנית:\s*(.*?)(?=\d[\d\-]{4,}\s+מספר תוכנית:|מספר תוכנית:)/s);
        let planNameRaw = planNameMatch ? planNameMatch[1].replace(/\s+/g, " ").trim() : "";

        let privateProduct = "", privateProductOther = "";
        if (/למשכנתא/.test(planNameRaw) && /חיים/.test(planNameRaw)) privateProduct = "פוליסת חיים למשכנתא";
        else if (/משועבד/.test(planNameRaw) && /חיים/.test(planNameRaw)) privateProduct = "פוליסת חיים משועבדת";
        else if (/משכנתא/.test(planNameRaw)) privateProduct = "פוליסת משכנתא";
        else if (/מחלות קשות/.test(planNameRaw) && /בריאות/.test(planNameRaw)) privateProduct = "ביטוח בריאות ומחלות קשות";
        else if (/מחלות קשות/.test(planNameRaw)) privateProduct = "ביטוח מחלות קשות";
        else if (/בריאות/.test(planNameRaw)) privateProduct = "ביטוח בריאות";
        else if (/חיים/.test(planNameRaw)) privateProduct = "פוליסת חיים";
        else if (/ריסק/.test(planNameRaw)) privateProduct = "פוליסת חיים";
        else if (/מגן/.test(planNameRaw)) privateProduct = "פוליסת חיים";
        else { privateProduct = "אחר"; privateProductOther = planNameRaw; }

        actions.push({
          index: actions.length, type: "פרט", privateCompany, privateProduct, privateProductOther,
          policyNumber, insuranceSum, newPolicyPremium: premium, fromPdf: true, reasons: []
        });
        return;
      }

      let company = "לא זוהה";
      const foundCompany = allCompaniesForMatch.find(c => {
        const re = new RegExp("(^|\\s)" + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "(\\s|$)");
        return re.test(rawCompany);
      });
      if (foundCompany) company = foundCompany;

      let product = productMap[rawProductType] || rawProductType || "";
      if (product === "קופת גמל" && /להשקעה/.test(section.slice(0, 300))) { product = "קופת גמל להשקעה"; }

      let accountNumber = "";
      let m = section.match(/(\d[\d\-]{4,})\s+מספר תוכנית:/) || section.match(/מספר תוכנית:\s*(\d[\d\-]{4,})/);
      if (m) accountNumber = m[1];

      let managementFee = "";
      m = section.match(/([\d.]+%)\s+ד\.ניהול מצבירה:/) || section.match(/ד\.ניהול מצבירה:\s*([\d.]+%)/);
      if (m) managementFee = m[1];

      let managementFeeDeposit = "";
      m = section.match(/([\d.]+%)\s+ד\.ניהול מהפקדה:/) || section.match(/ד\.ניהול מהפקדה:\s*([\d.]+%)/);
      if (m) managementFeeDeposit = m[1];

      if (managementFeeDeposit) { managementFee = `${managementFee} מצבירה + ${managementFeeDeposit} מהפקדה`; }

      let trackCode = "";
      m = section.match(/(\d{2,4})\s+מסלול:/);
      if (m) trackCode = m[1];

      let trackName = "";
      m = section.match(/מסלול:\s*(.*?)(?=\s*ד\.ניהול)/s);
      if (m) {
        let chunk = m[1];
        chunk = chunk.replace(/[\d.]+%\s*נכסים:\s*/g, '');
        chunk = chunk.replace(/מסלול:\s*/g, '');
        chunk = chunk.replace(/(^|\s)\d+(?=\s|$)/g, ' ');
        chunk = chunk.replace(/([A-Za-z0-9&]+)\s{2,}([א-ת][^%]*?)(?=\s{2,}|$)/g, '$2 $1');
        chunk = chunk.replace(/([\d.]+%)\s{2,}([^\d%][^%]*?)(?=\s{2,}|$)/g, '$2 $1');
        chunk = chunk.replace(/[\d.]+%\s*$/, '').trim();
        trackName = chunk.replace(/\s+/g, ' ').trim();
      }

      let currentTrack = trackName || (trackCode ? `מסלול ${trackCode}` : "");

      let employmentType = "";
      m = section.match(/מעמד:\s*(עצמאי|שכיר|שכירה|לא עובד)/);
      if (m) {
        if (m[1] === "עצמאי") employmentType = "עצמאית";
        else if (m[1] === "שכיר" || m[1] === "שכירה") employmentType = "שכירה";
        else employmentType = "ללא";
      }

      let employerName = "";
      const employerMatch = section.match(/מעסיק נוכחי:\s*(.*?)(?:קיים|השיקול|מספר תוכנית|תאריך|$)/i);
      if (employerMatch) {
        employerName = employerMatch[1].replace(/\s+/g, " ").trim();
        if (employerName.endsWith("בע")) employerName += '"מ';
        if (!employmentType) employmentType = "שכירה";
      }

      actions.push({
        index: actions.length, type: null, company, product, accountNumber, currentTrack,
        managementFee, employmentType, employerName, fromPdf: true, reasons: []
      });
    });

    totalActions = actions.length;
    currentActionIndex = 0;
    history = [];
    currentStep = "fundPreview";
    document.getElementById("pdfBox").classList.add("hidden");
    render();
  }

  function showSummary() {
    const box = document.getElementById("summaryBox");
    const copyBtn = document.getElementById("copyBtn");
    const lines = [];

    if (mode === MODE_SUMMARY) {
      lines.push("בהמשך לשיחתנו");
      lines.push("סוכם על הדברים הבאים:");
      lines.push("");
    } else {
      lines.push("בהמשך לשיחתנו");
      lines.push("להלן ההמלצות שנאמרו בשיחה:");
      lines.push("");
    }

    const validActionsCount = actions.filter(a => a && a.type).length;
    let itemCounter = 0;

    actions.forEach((a, idx) => {
      if (!a || !a.type) return;

      itemCounter++;
      let line = validActionsCount > 1 ? `${itemCounter}. ` : "";

      if (a.type !== "פרט") {
        const company = formatCompanyWithOther(a.company, a.companyOther);
        const product = resolveProduct(a);
        let empPart = "";
        if (["קרן פנסיה","קרן השתלמות","קופת גמל"].includes(product)) {
          if (a.employmentType === "שכירה" && a.employerName) empPart = ` שכירה תחת המעסיק ${a.employerName}`;
          else if (a.employmentType === "עצמאית") empPart = " עצמאית";
        }

        let depositPart = "";
        if (shouldAskDeposit(a) && a.depositType && a.depositType !== "ללא הפקדה") {
          if (a.depositType === "הוראת קבע") depositPart = ` עם הוראת קבע של ${a.depositMonthly} ₪ בחודש`;
          if (a.depositType === "חד פעמי") depositPart = ` עם הפקדה חד פעמית של ${a.depositOneTime} ₪`;
          if (a.depositType === "גם וגם") depositPart = ` עם הוראת קבע של ${a.depositMonthly} ₪ בחודש והפקדה חד פעמית של ${a.depositOneTime} ₪`;
          if (a.depositType === "אחר" && a.depositTypeOther) depositPart = ` עם אופי הפקדה: ${a.depositTypeOther}`;
        }

        if (a.type === "פתיחת קופה") {
          let track = (a.openTrack === "אחר" ? a.openTrackOther : a.openTrack);
          track = formatTrack(track || "");
          const mgmt = (a.managementFee === "אחר" ? a.managementFeeOther : a.managementFee);
          line += `פתיחת ${product}${empPart} בחברת ${company} כאשר הכסף יושקע במסלול השקעה ${track} בדמי ניהול ${mgmt}${depositPart}.`;
        }

        if (a.type === "ניוד") {
          const target = formatCompanyWithOther(a.targetCompany, a.targetCompanyOther);
          let track = (a.openTrack === "אחר" ? a.openTrackOther : a.openTrack);
          track = formatTrack(track || "");
          const mgmt = (a.managementFee === "אחר" ? (a.managementFeeOther || "") : (a.managementFee || ""));
          line += `${company} ${product}${empPart} מספר קופה ${a.accountNumber} - תנויד לחברת ${target} כאשר הכסף יושקע במסלול השקעה ${track} בדמי ניהול ${mgmt}${depositPart}.`;
        }

        if (a.type === "השארה") {
          if (a.keepType === "ללא שינוי") {
            line += `${company} ${product}${empPart} מספר קופה ${a.accountNumber} - תישאר ללא שינוי${depositPart}.`;
          } else if (a.keepType === "שינוי מסלול השקעה") {
            let cur = (a.currentTrack === "אחר" ? a.currentTrackOther : a.currentTrack) || "";
            let nt = (a.newTrack === "אחר" ? a.newTrackOther : a.newTrack) || "";
            cur = formatTrack(cur || "");
            nt = formatTrack(nt || "");
            const mgmt = (a.managementFee === "אחר" ? a.managementFeeOther : a.managementFee);

            const trackChanged = !!nt && nt !== "ללא שינוי";
            const mgmtChanged = !!mgmt && mgmt !== "ללא שינוי";

            let changeClauses = [];
            if (trackChanged) changeClauses.push(`יתבצע שינוי מסלול מ${cur} ל${nt}`);
            if (mgmtChanged) changeClauses.push(`ישתנו דמי הניהול ל-${mgmt}`);

            if (changeClauses.length > 0) {
              line += `${company} ${product}${empPart} מספר קופה ${a.accountNumber} - תישאר באותה חברה כאשר ${changeClauses.join(" ו")}${depositPart}.`;
            } else {
              line += `${company} ${product}${empPart} מספר קופה ${a.accountNumber} - תישאר ללא שינוי${depositPart}.`;
            }
          } else if (a.keepType === "מינוי סוכן") {
            line += `${company} ${product}${empPart} מספר קופה ${a.accountNumber} - יתבצע מינוי סוכן בקופה זו.`;
          }
        }
      } else {
        const company = formatCompanyWithOther(a.privateCompany, a.privateCompanyOther);
        const product = (a.privateProduct === "אחר" ? a.privateProductOther : a.privateProduct);

        if (a.privateAction === "ביטול") {
          line += `${product} בחברת ${company} מספר פוליסה ${a.policyNumber} - תבוטל.`;
        } else if (a.privateAction === "השארה") {
          line += `${product} בחברת ${company} מספר פוליסה ${a.policyNumber} - תישאר ללא שינוי.`;
        } else if (a.privateAction === "מינוי סוכן") {
          line += `${product} בחברת ${company} מספר פוליסה ${a.policyNumber} - יתבצע מינוי סוכן בפוליסה זו.`;
        } else if (a.privateAction === "הפקה") {
          let newType = (a.newPolicyType === "אחר" ? a.newPolicyTypeOther : (a.newPolicyType || product));
          let newComp = formatCompanyWithOther(a.newPolicyCompany, a.newPolicyCompanyOther);
          let sumPart = "";
          const lifeTypes2 = ["פוליסת חיים","פוליסת חיים משועבדת","פוליסת חיים למשכנתא","ביטוח בריאות","ביטוח בריאות ומחלות קשות","ביטוח מחלות קשות"];
          if (lifeTypes2.includes(product) && a.insuranceSum) sumPart = ` עם פיצוי של ${a.insuranceSum} ₪`;
          if (mode === MODE_RECOMMENDATION) {
            line += `פתיחת ${newType}${sumPart} בחברת ${newComp} בפרמיה חודשית של ${a.newPolicyPremium} ₪.`;
          } else {
            line += `תופק ${newType}${sumPart} בחברת ${newComp} בפרמיה חודשית של ${a.newPolicyPremium} ₪.`;
          }
        } else if (a.privateAction === "ביטול והפקה חדשה") {
          let newType = (a.newPolicyType === "אחר" ? a.newPolicyTypeOther : a.newPolicyType);
          let newComp = formatCompanyWithOther(a.newPolicyCompany, a.newPolicyCompanyOther);
          let sumPart = "";
          const lifeTypes2 = ["פוליסת חיים","פוליסת חיים משועבדת","פוליסת חיים למשכנתא","ביטוח בריאות","ביטוח בריאות ומחלות קשות","ביטוח מחלות קשות"];
          if (lifeTypes2.includes(product) && a.insuranceSum) sumPart = ` עם פיצוי של ${a.insuranceSum} ₪`;
          line += `${product} בחברת ${company} מספר פוליסה ${a.policyNumber} - פוליסה זו תתבטל ובמקום זה תופק ${newType}${sumPart} בחברת ${newComp} בפרמיה חודשית של ${a.newPolicyPremium} ₪.`;
        }
      }

      if (mode === MODE_RECOMMENDATION && a.reasons && a.reasons.length) {
        line += "\nלהלן הסיבות להמלצה זאת:\n";
        if (a.reasons.length === 1) {
          line += a.reasons[0];
        } else {
          a.reasons.forEach((r, i) => {
            const letter = HEBREW_LETTERS[i] || "";
            line += `${letter}. ${r}\n`;
          });
          line = line.trimEnd();
        }
      }

      lines.push(line);
      lines.push("");
    });

    box.textContent = lines.join("\n").trim();
    box.classList.remove("hidden");
    copyBtn.classList.remove("hidden");
    copyBtn.onclick = () => {
      try { navigator.clipboard.writeText(box.textContent || ""); } catch (e) {}
    };
  }

  document.getElementById("nextBtn").addEventListener("click", () => {
    const isValid = saveCurrentStep();
    if (!isValid) return;
    history.push(currentStep);
    const next = computeNextStep();
    if (next !== null) { currentStep = next; render(); } else { showSummary(); }
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    if (!history.length) return;
    currentStep = history.pop();
    render();
  });

  render();

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = document.getElementById("summaryBox").textContent;
    try { await navigator.clipboard.writeText(text); } catch (err) {}
  });

</script>
</body>
</html>
